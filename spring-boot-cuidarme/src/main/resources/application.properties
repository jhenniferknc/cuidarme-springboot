spring.application.name=cuidarme
server.servlet.context-path=/cuidarme/api/
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html#application-properties.web.spring.mvc.problemdetails.enabled
spring.mvc.problemdetails.enabled=true
server.port=${PORT:8082}

# Database
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${MOSTRAR_SQL:true}
spring.jpa.properties.hibernate.format_sql=${MOSTRAR_SQL:true}
spring.jpa.properties.hibernate.use_sql_comments=${MOSTRAR_SQL:true}


spring.jpa.database=postgresql
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.sql.init.mode=always

springdoc.override-with-generic-response=false

springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}

cors.origens=${CORS_ORIGENS:http://localhost:3000,http://localhost:3001,http://localhost:8081}
